<script>
const $=i=>document.getElementById(i),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('bn-BD'),nf=n=>String(Math.round(n*100)/100);
const LC=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString()},dk=t=>LC(t).slice(0,10),today=()=>dk(new Date());
const dlab=k=>new Date(k+'T00:00:00').toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'}),tlab=t=>new Date(t).toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit',hour12:true});
const mlab=m=>new Date(m+'-01T00:00:00').toLocaleDateString('bn-BD',{month:'long',year:'numeric'});
const TL={in:'ক্যাশ ইন',out:'ক্যাশ আউট',b2bin:'বিটুবি ইন',b2bout:'বিটুবি আউট',last:'শেষ ব্যালেন্স',comm:'কমিশন',cash:'ক্যাশ',paybill:'পে বিল'},POS={out:1,b2bin:1,last:1,comm:1,cash:1};
let D={dokan:[],wp:[],bank:[],names:[],bnames:[],med:[],rec:[],rnames:[],adj:[],acc:{},ts:0};
try{const s=JSON.parse(localStorage.getItem('hisab1'));if(s)D=Object.assign(D,s)}catch(e){}
['dokan','wp','bank','names','bnames','med','rec','rnames','adj'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});if(!D.acc||typeof D.acc!=='object')D.acc={};D.ts=D.ts||0;
let pg='in',ds='cash',day=today(),sd=today(),mon=today().slice(0,7),rf='',kind='tx',tbl='dokan',io='',nt='a',eid=null,dl=null;
function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad show':'show';setTimeout(()=>t.className='',2400)}
/* হিসাব */
const isAg=e=>!(D.acc[e.name]&&D.acc[e.name].t==='p');
const ac=e=>{if(e.cm===false||!(D.dokan.includes(e)||D.wp.includes(e))||!isAg(e))return 0;return e.type==='in'?e.amt*.00375:e.type==='out'?e.amt*.004:0};
function sm(rows){const s={in:0,out:0,b2bin:0,b2bout:0,last:0,comm:0,paybill:0,cash:0};rows.forEach(e=>{s[e.type]+=e.amt;s.comm+=ac(e)});return s}
const bal=(l,s)=>l+s.out+s.b2bin+s.comm-s.in-s.paybill;
const rs=e=>e.sg!=null?e.sg*e.amt:(e.type==='in'?e.amt:0);
function cashDay(d){const days={};const add=(k,f,v)=>{(days[k]=days[k]||{cin:0,pb:0,man:0,med:0,rec:0,cout:0})[f]+=v};
 D.dokan.forEach(e=>{const k=dk(e.ts);if(e.type==='in')add(k,'cin',e.amt);else if(e.type==='out')add(k,'cout',e.amt);else if(e.type==='paybill')add(k,'pb',e.amt);else if(e.type==='cash')add(k,'man',e.amt)});
 D.adj.forEach(e=>add(dk(e.ts),'man',e.amt));D.med.forEach(e=>add(dk(e.ts),'med',e.k==='buy'?-e.amt:e.amt));D.rec.forEach(e=>add(dk(e.ts),'rec',rs(e)));
 let open=0;for(const k of Object.keys(days).sort()){if(k>=d)break;const x=days[k];open+=x.cin+x.pb+x.man+x.med+x.rec-x.cout}
 const x=days[d]||{cin:0,pb:0,man:0,med:0,rec:0,cout:0};return {...x,open,close:open+x.cin+x.pb+x.man+x.med+x.rec-x.cout}}
function wpStart(d,tb){const days={};D[tb].forEach(e=>{const x=days[dk(e.ts)]=days[dk(e.ts)]||{in:0,out:0,last:0,hl:0};if(e.type==='in')x.in+=e.amt;else if(e.type==='out')x.out+=e.amt;else if(e.type==='last'){x.last+=e.amt;x.hl=1}});
 let c=0;for(const k of Object.keys(days).sort()){if(k>=d)break;const x=days[k];c=(x.hl?x.last:c)+x.out-x.in}const m=days[d];return m&&m.hl?m.last:c}
function acct(n,tbs,d){const rows=[];tbs.forEach(k=>D[k].forEach(e=>{if(e.name===n&&e.type!=='cash')rows.push(e)}));
 const o=(D.acc[n]||{}).o||0,days={};rows.forEach(e=>(days[dk(e.ts)]=days[dk(e.ts)]||[]).push(e));let last,s;
 if(!d){s=sm(rows);last=o+s.last}else{let c=o;for(const k of Object.keys(days).sort()){if(k>=d)break;const r=days[k],x=sm(r);c=bal(r.some(e=>e.type==='last')?x.last:c,x)}const r=days[d]||[];s=sm(r);last=r.some(e=>e.type==='last')?s.last:c}
 return {...s,last,act:(days[d]||[]).length,tot:bal(last,s)}}
const accNames=tbs=>{const s=new Set(tbs[0]==='bank'?D.bnames:D.names);tbs.forEach(k=>D[k].forEach(e=>{if(e.type!=='cash')s.add(e.name)}));return[...s]};
const GR=[['দোকান + ডব্লিউপি',['dokan','wp']],['ব্যাংক',['bank']]];
function sumData(){return GR.map(g=>[g[0],accNames(g[1]).map(n=>[n,acct(n,g[1],sd)]).filter(x=>!sd||x[1].act>0||x[1].last!==0)]).filter(g=>g[1].length)}
/* সেভ ও ক্লাউড */
let DB=null,UID=null,TM=null;const ref=k=>DB.collection('data/users/'+UID).doc(k),syn=t=>$('syn').textContent=t;
function save(){D.ts=Date.now();try{localStorage.setItem('hisab1',JSON.stringify(D))}catch(e){}push()}
function push(){if(!DB||!UID)return;clearTimeout(TM);TM=setTimeout(()=>Promise.all([ref('dokan').set({items:D.dokan}),ref('wp').set({items:D.wp}),ref('bank').set({items:D.bank}),ref('med').set({items:D.med}),ref('rec').set({items:D.rec,names:D.rnames}),ref('meta').set({names:D.names,bnames:D.bnames,adj:D.adj,acc:Object.entries(D.acc).map(([n,a])=>({n,t:a.t,o:a.o})),ts:D.ts})]).then(()=>syn('✓ ডাটা ক্লাউডে সেভ আছে')).catch(()=>syn('ডাটা শুধু এই ব্রাউজারে সেভ আছে')),600)}
(async()=>{try{if(!window.claude||!claude.use){syn('ডাটা শুধু এই ব্রাউজারে সেভ আছে');return}
 const[db,us]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!us){syn('ডাটা শুধু এই ব্রাউজারে সেভ আছে');return}
 const id=await us.id();if(!id){syn('ডাটা শুধু এই ব্রাউজারে সেভ আছে');return}DB=db;UID=id;
 const[d,w,m,b,md,rc]=await Promise.all(['dokan','wp','meta','bank','med','rec'].map(k=>ref(k).get())),cp=x=>JSON.parse(JSON.stringify(x||[]));
 if(d.exists||w.exists||m.exists){const rm=m.exists?m.data():{},rts=rm.ts||0;
  if(rts>=D.ts){D={dokan:d.exists?cp(d.data().items):[],wp:w.exists?cp(w.data().items):[],bank:b.exists?cp(b.data().items):[],med:md.exists?cp(md.data().items):[],rec:rc.exists?cp(rc.data().items):[],rnames:rc.exists?cp(rc.data().names):[],names:cp(rm.names),bnames:cp(rm.bnames),adj:cp(rm.adj),acc:{},ts:rts};cp(rm.acc).forEach(a=>D.acc[a.n]={t:a.t,o:a.o});try{localStorage.setItem('hisab1',JSON.stringify(D))}catch(e){}render();syn('✓ ডাটা ক্লাউডে সেভ আছে')}
  else{push();syn('✓ ক্লাউডে সেভ হচ্ছে')}}
 else if(D.dokan.length||D.wp.length||D.bank.length||D.med.length||D.rec.length||D.names.length){push();syn('✓ ক্লাউডে সেভ হচ্ছে')}else syn('✓ ডাটা ক্লাউডে সেভ হবে')}catch(e){syn('ডাটা শুধু এই ব্রাউজারে সেভ আছে')}})();
/* নেভিগেশন */
function go(p){pg=p;eid=null;$('svtx').textContent='সেভ';render();scrollTo(0,0)}
function render(){document.querySelectorAll('.pgx').forEach(e=>e.style.display='none');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===pg));
 if(pg==='in'){$('pg-in').style.display='block';setK(kind);setT(tbl);return}
 const m=$('main');m.style.display='block';m.innerHTML={dokan:rDokan,wp:()=>rTb('wp'),bank:()=>rTb('bank'),sum:rSum}[pg]()}
const sday=v=>{day=v||today();render()},ssd=v=>{sd=v;render()};
const dbar=(v,f,all)=>`<div class="row2" style="margin:0 0 12px"><input type="date" value="${v}" onchange="${f}(this.value)" style="margin:0"><button class="b" onclick="${f}('${all?'':today()}')">${all?'সব তারিখ':'আজ'}</button></div>`;
function dd(k,fn){if(dl!==k){dl=k;render();return}dl=null;fn();save();render()}
const dbtn=k=>`<button class="lk" onclick="dd('${k}',()=>del('${k}'))">${dl===k?'<b style="color:var(--r)">আবার চাপুন</b>':'ডিলিট'}</button>`;
function del(k){const t=k[0],id=+k.slice(1);if(t==='t')['dokan','wp','bank'].forEach(x=>D[x]=D[x].filter(e=>e.id!==id));else if(t==='m')D.med=D.med.filter(e=>e.id!==id);else if(t==='r')D.rec=D.rec.filter(e=>e.id!==id);else D.adj=D.adj.filter(e=>e.id!==id)}
/* দোকান */
function rDokan(){const c=cashDay(day);return dbar(day,'sday')+`<div class="big"><small>দোকানের ক্যাশ — ${dlab(day)}</small><b>${fmt(c.close)}</b></div><div class="seg">${[['cash','ক্যাশ'],['med','মেডিসিন'],['rec','রিচার্জ'],['tx','লেনদেন']].map(x=>`<button class="${ds===x[0]?'on':''}" onclick="ds='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div style="height:12px"></div>`+{cash:()=>vCash(c),med:vMed,rec:vRec,tx:()=>vTx('dokan')}[ds]()}
const sr=(l,v,c='')=>`<div class="sr ${c}"><span>${l}</span><b>${v}</b></div>`;
function vCash(c){const ad=D.adj.filter(e=>dk(e.ts)===day);return `<div class="card"><div class="hd">ক্যাশের হিসাব</div>${sr('শুরুর ক্যাশ (আগের দিনের)',fmt(c.open))}${sr('ক্যাশ ইন',fmt(c.cin))}${sr('পে বিল',fmt(c.pb))}${sr('ম্যানুয়াল ক্যাশ (+/−)',fmt(c.man))}${sr('মেডিসিন (+/−)',fmt(c.med))}${sr('রিচার্জ (+/−)',fmt(c.rec))}${sr('ক্যাশ আউট (−)',fmt(-c.cout))}${sr('ক্যাশ',fmt(c.close),'t')}</div><div class="card"><div class="hd">ম্যানুয়াল ক্যাশ এন্ট্রি</div>${ad.length?ad.map(e=>`<div class="ln"><div><small>${E(e.note||'—')} · ${tlab(e.ts)}</small>${dbtn('a'+e.id)}</div><div class="am ${e.amt>0?'p':'m'}">${e.amt>0?'+':'−'}${fmt(Math.abs(e.amt))}</div></div>`).join(''):'<small style="color:var(--m)">এই দিনে কোনো এন্ট্রি নেই</small>'}</div>`}
function vMed(){const ents=D.med.filter(e=>dk(e.ts).slice(0,7)===mon).sort((a,b)=>new Date(b.ts)-new Date(a.ts));let se=0,bu=0,ds1=0,db=0;ents.forEach(e=>e.k==='buy'?bu+=e.amt:se+=e.amt);D.med.forEach(e=>{if(dk(e.ts)===day)e.k==='buy'?db+=e.amt:ds1+=e.amt});
 const days={};ents.forEach(e=>(days[dk(e.ts)]=days[dk(e.ts)]||[]).push(e));
 return `<input type="month" value="${mon}" onchange="mon=this.value||mon;render()" style="margin:0 0 12px"><div class="big"><small>মেডিসিন — ${mlab(mon)} (বিক্রি − ক্রয়)</small><b>${fmt(se-bu)}</b><div class="ts"><div><span>মাসে বিক্রি</span><b>${fmt(se)}</b></div><div><span>মাসে ক্রয়</span><b>${fmt(bu)}</b></div></div><div class="ts"><div><span>${dlab(day)} বিক্রি</span><b>${fmt(ds1)}</b></div><div><span>${dlab(day)} ক্রয়</span><b>${fmt(db)}</b></div></div></div><div class="card">${Object.keys(days).length?Object.keys(days).sort().reverse().map(k=>{let n=0;days[k].forEach(e=>n+=e.k==='buy'?-e.amt:e.amt);return `<div class="sr t"><span>${dlab(k)}</span><b>${fmt(n)}</b></div>`+days[k].map(e=>`<div class="ln"><div><small>${e.k==='buy'?'ক্রয়':'বিক্রি'} · ${E(e.note||'—')} · ${tlab(e.ts)}</small>${dbtn('m'+e.id)}</div><div class="am ${e.k==='buy'?'m':'p'}">${e.k==='buy'?'−':'+'}${fmt(e.amt)}</div></div>`).join('')}).join(''):'<small style="color:var(--m)">এই মাসে কোনো এন্ট্রি নেই</small>'}</div>`}
function vRec(){const nm=[...new Set([...D.rnames,...D.rec.map(e=>e.name)])],rows=D.rec.filter(e=>!rf||e.name===rf).sort((a,b)=>new Date(b.ts)-new Date(a.ts));let b=0;rows.forEach(e=>b+=rs(e));
 return `<select onchange="rf=this.value;render()" style="margin:0 0 12px"><option value="">সব অ্যাকাউন্ট</option>${nm.map(n=>`<option${n===rf?' selected':''}>${E(n)}</option>`).join('')}</select><div class="big"><small>রিচার্জ ব্যালেন্স — ${rf?E(rf):'সব'}</small><b>${fmt(b)}</b></div><div class="card">${rows.length?rows.map(e=>{const v=rs(e);return `<div class="ln"><div><b>${E(e.name)}</b><small>${E(e.note||'—')} · ${dlab(dk(e.ts))} ${tlab(e.ts)}</small>${dbtn('r'+e.id)}</div><div class="am ${v>=0?'p':'m'}">${v>=0?'+':'−'}${fmt(Math.abs(v))}</div></div>`}).join(''):'<small style="color:var(--m)">কোনো এন্ট্রি নেই</small>'}</div>`}
function trow(tb,e){const a=ac(e),p=POS[e.type];return `<div class="ln"><div><b>${E(e.name)}</b><small>${E(e.num||'-')} · ${TL[e.type]}${a?` · কমিশন +${fmt(a)}`:''}</small><button class="lk" onclick="ed('${tb}',${e.id})">সম্পাদনা</button>${dbtn('t'+e.id)}</div><div class="am ${p?'p':'m'}">${p?'+':'−'}${fmt(e.amt)}<small>${tlab(e.ts)}</small></div></div>`}
function vTx(tb){const rows=D[tb].filter(e=>dk(e.ts)===day).sort((a,b)=>new Date(b.ts)-new Date(a.ts)),s=sm(rows);
 return `<div class="card"><div class="ts" style="margin:0">${[['ক্যাশ ইন',s.in],['ক্যাশ আউট',s.out],['কমিশন',s.comm]].map(x=>`<div style="background:#f3f5fb"><span style="color:var(--m)">${x[0]}</span><b>${fmt(x[1])}</b></div>`).join('')}</div></div><div class="card">${rows.length?rows.map(e=>trow(tb,e)).join(''):'<small style="color:var(--m)">এই দিনে কোনো লেনদেন নেই</small>'}</div>`}
function rTb(tb){const ls=wpStart(day,tb),s=sm(D[tb].filter(e=>dk(e.ts)===day));
 return dbar(day,'sday')+`<div class="big"><small>${tb==='wp'?'ডব্লিউপি':'ব্যাংক'} — ${dlab(day)} এর ব্যালেন্স</small><b>${fmt(ls+s.out-s.in)}</b><div class="ts"><div><span>আগের ব্যালেন্স</span><b>${fmt(ls)}</b></div></div></div>`+(tb==='wp'?'<button class="b w" onclick="shareWP()">ডব্লিউপি টেক্সট পাঠান</button>':'')+vTx(tb)}
function shareWP(){const rows=D.wp.filter(e=>dk(e.ts)===day),s=sm(rows),l=rows.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0],dg=(l?String(l.num||'').replace(/\D/g,'').slice(-4):'')||'----',lb=wpStart(day,'wp'),m=lb+s.out;
 wa(new Date(day+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+'\n'+dg+'-'+nf(s.in)+'\njoma-'+nf(s.out)+'\nBalance - '+nf(lb)+'+'+nf(s.out)+'='+nf(m)+'-'+nf(s.in)+'='+nf(m-s.in))}
function wa(t){const a=document.createElement('a');a.href='https://wa.me/8801866212500?text='+encodeURIComponent(t);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
/* সামারি */
const aLines=a=>[['শেষ ব্যালেন্স',a.last],['ক্যাশ ইন',a.in],['ক্যাশ আউট',a.out],['বিটুবি ইন',a.b2bin],['বিটুবি আউট',a.b2bout],['কমিশন',a.comm],['পে বিল',a.paybill],['ব্যালেন্স',a.tot]];
function rSum(){const G=sumData();let h=dbar(sd,'ssd',1)+`<div class="mut" style="margin:0 2px 8px;color:var(--m)">${sd?dlab(sd):'সব তারিখ'}</div>`;
 G.forEach(g=>{h+=`<div class="hd" style="margin:14px 2px 8px">${g[0]}</div>`;g[1].forEach(x=>{h+=`<div class="card"><div class="hd">${E(x[0])} <small style="color:var(--m);font-weight:400">· ${(D.acc[x[0]]||{}).t==='p'?'পারসোনাল':'এজেন্ট'}</small></div>${aLines(x[1]).map((l,i)=>sr(l[0],fmt(l[1]),i===7?'t':'')).join('')}</div>`})});
 if(!G.length)h+='<div class="card"><small style="color:var(--m)">কোনো এন্ট্রি নেই</small></div>';
 if(sd){const c=cashDay(sd);h+=`<div class="hd" style="margin:14px 2px 8px">দোকানের ক্যাশ</div><div class="card">${sr('শুরুর ক্যাশ',fmt(c.open))}${sr('ক্যাশ',fmt(c.close),'t')}</div>`}
 let ms=0,mb=0;D.med.forEach(e=>{if(!sd||dk(e.ts)===sd)e.k==='buy'?mb+=e.amt:ms+=e.amt});let rb=0;D.rec.forEach(e=>{if(!sd||dk(e.ts)===sd)rb+=rs(e)});
 h+=`<div class="hd" style="margin:14px 2px 8px">মেডিসিন ও রিচার্জ</div><div class="card">${sr('মেডিসিন বিক্রি',fmt(ms))}${sr('মেডিসিন ক্রয়',fmt(mb))}${sr('রিচার্জ (+/−)',fmt(rb))}</div><button class="b w" onclick="shareSum()">হোয়াটসঅ্যাপে পাঠান</button>`;return h}
function shareSum(){let t='*সামারি — '+(sd?dlab(sd):'সব তারিখ')+'*';sumData().forEach(g=>{t+='\n\n*'+g[0]+'*';g[1].forEach(x=>{t+='\n\n_'+x[0]+'_'+aLines(x[1]).filter((l,i)=>i===7||l[1]!==0).map(l=>'\n'+l[0]+': '+nf(l[1])).join('')})});wa(t)}
/* ইনপুট */
function tg(i){const e=$(i);e.style.display=e.style.display==='block'?'none':'block'}
function setK(k){kind=k;document.querySelectorAll('.fx').forEach(e=>e.style.display=e.id==='f-'+k?'block':'none');document.querySelectorAll('#kseg button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));if(k==='rec')$('rl').innerHTML=[...new Set([...D.rnames,...D.rec.map(e=>e.name)])].map(n=>`<option value="${E(n)}">`).join('');if(!$('edate').value)$('edate').value=today()}
function setT(t){tbl=t;document.querySelectorAll('#tseg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));const o=$('oth').querySelector('[value=paybill]');o.hidden=o.disabled=t!=='dokan';fillAcc()}
function fillAcc(){const v=$('acc').value,n=accNames(tbl==='bank'?['bank']:['dokan','wp']);$('acc').innerHTML='<option value="">অ্যাকাউন্ট বাছাই করুন</option>'+n.map(x=>`<option${x===v?' selected':''}>${E(x)}</option>`).join('')}
function setIO(v){io=v;document.querySelectorAll('#ioseg button').forEach(b=>b.classList.toggle('on',b.dataset.i===v));if(v)$('oth').value=''}
function setNT(t){nt=t;$('nt-a').classList.toggle('on',t==='a');$('nt-p').classList.toggle('on',t==='p')}
function addAcc(){const n=$('nn').value.trim();if(!n)return toast('নাম লিখুন',1);const l=parseFloat($('nl').value)||0,L=tbl==='bank'?D.bnames:D.names;if(!L.includes(n))L.push(n);D.acc[n]={t:nt,o:l};save();$('nn').value='';$('nl').value='';$('na').style.display='none';fillAcc();$('acc').value=n;toast('✓ অ্যাকাউন্ট যোগ হয়েছে')}
function delAcc(){const n=$('acc').value;if(!n)return toast('আগে অ্যাকাউন্ট বাছাই করুন',1);if(dl!=='x'+n){dl='x'+n;return toast('"'+n+'" মুছতে আবার চাপুন — এর সব এন্ট্রি মুছে যাবে',1)}dl=null;const g=tbl==='bank'?['bank']:['dokan','wp'];g.forEach(k=>D[k]=D[k].filter(e=>e.name!==n));D.names=D.names.filter(x=>x!==n);D.bnames=D.bnames.filter(x=>x!==n);delete D.acc[n];save();fillAcc();toast('✓ মুছে ফেলা হয়েছে')}
function tsOf(){const d=$('edate').value||today();return d===today()?new Date().toISOString():new Date(d+'T'+new Date().toTimeString().slice(0,8)).toISOString()}
function saveTx(){const n=$('acc').value,a=parseFloat($('amt').value),t=$('oth').value||io;if(!n)return toast('অ্যাকাউন্ট বাছাই করুন',1);if(isNaN(a))return toast('টাকা লিখুন',1);if(!t)return toast('ইন/আউট অথবা অন্যান্য বাছাই করুন',1);if(t==='paybill'&&tbl!=='dokan')return toast('পে বিল শুধু দোকানে',1);
 const e={id:Date.now(),name:n,num:$('num').value.trim(),amt:a,type:t,ts:tsOf()};if(eid){D[eid.tb]=D[eid.tb].filter(x=>x.id!==eid.id);e.id=eid.id;eid=null;$('svtx').textContent='সেভ'}
 D[tbl].unshift(e);save();$('amt').value='';$('num').value='';$('oth').value='';setIO('');toast('✓ সেভ হয়েছে')}
function ed(tb,id){const e=D[tb].find(x=>x.id===id);if(!e)return;if(e.type==='cash')return toast('পুরনো ক্যাশ এন্ট্রি ডিলিট করে ক্যাশ ± থেকে দিন',1);pg='in';kind='tx';tbl=tb;render();fillAcc();$('acc').value=e.name;$('num').value=e.num||'';$('amt').value=e.amt;$('edate').value=dk(e.ts);if(e.type==='in'||e.type==='out'){$('oth').value='';setIO(e.type)}else{setIO('');$('oth').value=e.type}eid={tb,id};$('svtx').textContent='আপডেট';scrollTo(0,0)}
function saveAdj(sg){const a=parseFloat($('ca').value);if(isNaN(a)||a<=0)return toast('টাকা লিখুন',1);D.adj.unshift({id:Date.now(),amt:sg*a,note:$('cn').value.trim(),ts:tsOf()});save();$('ca').value='';$('cn').value='';toast('✓ ক্যাশ '+(sg>0?'যোগ':'বিয়োগ')+' হয়েছে')}
function saveMed(k){const a=parseFloat($('ma').value);if(isNaN(a)||a<=0)return toast('টাকা লিখুন',1);D.med.unshift({id:Date.now(),amt:a,k,note:$('mn').value.trim(),ts:tsOf()});save();$('ma').value='';$('mn').value='';toast('✓ মেডিসিন '+(k==='buy'?'ক্রয়':'বিক্রি')+' সেভ হয়েছে')}
function saveRec(sg){const n=$('rn').value.trim(),a=parseFloat($('ra').value);if(!n)return toast('অ্যাকাউন্টের নাম লিখুন',1);if(isNaN(a)||a<=0)return toast('টাকা লিখুন',1);if(!D.rnames.includes(n))D.rnames.push(n);D.rec.unshift({id:Date.now(),name:n,amt:a,sg,note:$('rt').value.trim(),ts:tsOf()});save();$('ra').value='';$('rt').value='';toast('✓ রিচার্জ সেভ হয়েছে')}
$('edate').value=today();render();
setInterval(()=>{if(today()!==go.ld){const o=go.ld;go.ld=today();if(o&&day===o)day=go.ld;if(o&&sd===o)sd=go.ld;if(pg!=='in')render()}},30000);go.ld=today();
/* লাইভ ঘড়ি (তারিখ + সময়, প্রতি সেকেন্ডে আপডেট) */
function tick(){const n=new Date();
 $('ck-t').textContent=n.toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
 $('ck-d').textContent=n.toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
tick();setInterval(tick,1000);
</script></body></html>
