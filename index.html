body{background:radial-gradient(1000px 360px at 50% -120px,rgba(122,77,240,.14),transparent),var(--bg);padding:14px 14px 40px;-webkit-text-size-adjust:100%}
.card,#top{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card{padding:14px}
#top{padding:10px 12px}

.vt{margin-top:10px}.vt button{padding:11px;font-size:15px;border-radius:12px}.sc{margin-bottom:10px}.sh{font-size:17px;font-weight:700;margin-bottom:6px}.sr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:15px}.sr:last-child{border:0}.sr span{color:var(--mut)}.sb{font-size:17px}.sb span{color:var(--tx);font-weight:600}.sb b{color:var(--ac)}

.r2 .add.dn{background:var(--mi);box-shadow:none}

.sv{gap:8px}.wpb{background:#25d366;padding:0 18px;box-shadow:0 2px 8px rgba(37,211,102,.35)}
:root{--bg:#f1f4f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--pl:#059669;--mi:#dc2626;--ac:#4f46e5}

button{font-family:inherit;cursor:pointer;transition:transform .12s ease,box-shadow .2s ease,filter .2s ease,background .2s ease}

.ts{display:flex;gap:6px;margin-top:12px}.ts div{flex:1;min-width:0;background:rgba(255,255,255,.16);border-radius:10px;padding:8px}.ts span{display:block;font-size:11px;opacity:.85}.ts b{font-size:15px;white-space:nowrap}.tn{font-size:11px;opacity:.75;margin-top:8px}
.ts2{display:flex;gap:8px}.ts2 div{flex:1;min-width:0;padding:10px;border-radius:12px;background:var(--bg)}.ts2 span{display:block;font-size:12px;color:var(--mut)}.ts2 b{font-size:17px;white-space:nowrap}.in2 b{color:var(--mi)}.out2 b{color:var(--pl)}.cm2 b{color:var(--ac)}

.pg{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}.pgi{max-width:680px;margin:0 auto}.wa.back{background:var(--card);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
.rrow{display:flex;gap:10px;margin-bottom:12px;align-items:stretch}.rrow .bc{flex:1.4}.rsb{flex:1;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:16px;background:linear-gradient(135deg,#0891b2,#06b6d4);box-shadow:0 4px 12px rgba(8,145,178,.32)}

<body>
